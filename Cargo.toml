[package]
name = "omarchy-expand"
version = "0.1.0-beta.1"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "A text expander for Omarchy with a terminal setup UI and snippet picker"
repository = "https://github.com/Razumasu/omarchy-expand"
readme = "README.md"
publish = false

[dependencies]
evdev = "0.13.2"
nix = { version = "0.29", features = ["inotify"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
xkbcommon-dl = "0.4.2"
